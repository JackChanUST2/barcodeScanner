<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Barcode Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@latest/umd/index.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Shared Inventory</p>
          <h1>Barcode Scanner</h1>
        </div>
        <div id="appVersion" class="app-version">v1.00</div>
      </header>

      <section class="scanner-card">
        <div class="video-wrap">
          <video id="video" autoplay playsinline muted></video>
          <div class="scan-line" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <button id="startScannerBtn" class="primary">Start Camera</button>
          <button id="scanNowBtn" class="secondary">Scan Barcode</button>
          <button id="stopScannerBtn" class="secondary">Stop</button>
        </div>

        <div class="status-panel">
          <span class="status-label">Status</span>
          <p id="statusText">Camera is ready when you start scanning.</p>
          <p id="debugText" class="debug-text">Debug: waiting for camera state.</p>
        </div>
      </section>

      <section class="panel">
        <h2>Scanned Code</h2>
        <div id="lastCode" class="last-code">No scanned code yet</div>
        <div id="stockResult" class="stock-result">Scan or enter a barcode to continue.</div>

        <div class="stock-actions">
          <button id="checkStockBtn" class="primary">Check Stock</button>
          <button id="addStockBtn" class="secondary">Add Stock</button>
        </div>

        <div class="manual-entry">
          <label for="manualCodeInput">Enter barcode manually</label>
          <div class="manual-row">
            <input
              id="manualCodeInput"
              type="text"
              inputmode="text"
              autocomplete="off"
              pattern="[A-Za-z0-9\-\.\/\+\s]+"
              placeholder="e.g. 1234567890"
            />
            <button id="useManualBtn" class="secondary">Use Barcode</button>
          </div>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
